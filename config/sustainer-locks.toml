# Absolute display angles about the parallel pin axes, viewed in the housing
# frame. The 15 mm link swings the large pin out by 14.5 mm. The outer plate
# tips forward before the lid rises, with 90 degrees between the two links.
release_inner_degrees = -75.0
release_outer_degrees = 15.0

# A vertical plate puts the hook behind the lid lip. The small forward offset
# of the large pin clears the facade. Source hook/lip crossings are reported.
[one_floor]
inner_degrees = -5.0
outer_degrees = 0.0

[tall]
inner_degrees = -5.0
outer_degrees = 0.0

# XL4's higher lid lip retains the same vertical clasp orientation.
[xl4]
inner_degrees = -5.0
outer_degrees = 0.0
